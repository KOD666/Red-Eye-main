apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.redeye.agent.installedapps'
version = '1.0.0'

buildscript {
  ext.kotlinVersion = '1.8.10'
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
  }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "com.redeye.agent.installedapps"
  compileSdk safeExtGet("compileSdkVersion", 34)

  defaultConfig {
    minSdk safeExtGet("minSdkVersion", 21)
    targetSdk safeExtGet("targetSdkVersion", 34)
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion"
}
